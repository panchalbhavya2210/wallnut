# Builds a signed release APK and publishes it as a GitHub Release.
#
# Triggers ONLY on pushes to main - i.e. when the development branch is merged
# into main. Pushing to development never starts a build (that is what
# .github/workflows/ci.yml is for). workflow_dispatch allows a manual build;
# manual runs upload the APK as an artifact but do not create a release.
#
# Versioning (per build):
#   versionCode = workflow run number        (unique, strictly increasing)
#   versionName = <app.json version>+b<run>  (e.g. 1.0.0+b42)
#   APK name    = wallnut-<version>-b<run>.apk
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   WALLNUT_KEYSTORE_BASE64  base64 of android/app/wallnut-release.keystore
#   WALLNUT_STORE_PASSWORD   keystore password
#   WALLNUT_KEY_ALIAS        key alias (wallnut)
#   WALLNUT_KEY_PASSWORD     key password
#
# The keystore is the same one local builds use, so `adb install -r` updates
# the installed app in place.

name: Android release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

env:
  CI: "true"
  EXPO_NO_TELEMETRY: "1"

jobs:
  verify:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build APK
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Set build version
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          node scripts/ci/set-version.mjs
          VERSION="$(node -p "require('./app.json').expo.version")"
          BASE="${VERSION%%+*}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "APK_NAME=wallnut-${BASE}-b${GITHUB_RUN_NUMBER}.apk" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v${BASE}-b${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Wire release signing
        env:
          WALLNUT_KEYSTORE_BASE64: ${{ secrets.WALLNUT_KEYSTORE_BASE64 }}
          WALLNUT_STORE_PASSWORD: ${{ secrets.WALLNUT_STORE_PASSWORD }}
          WALLNUT_KEY_ALIAS: ${{ secrets.WALLNUT_KEY_ALIAS }}
          WALLNUT_KEY_PASSWORD: ${{ secrets.WALLNUT_KEY_PASSWORD }}
        run: node scripts/ci/setup-signing.mjs

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Collect the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "$APK_NAME"

      - name: Upload the APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Publish the GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --yes --cleanup-tag
          fi
          cat > release-notes.md <<EOF
          Signed release APK built from ${GITHUB_SHA} (workflow run #${GITHUB_RUN_NUMBER}).

          Install with \`adb install -r ${APK_NAME}\` or copy it to the phone and tap it.

          - versionName: ${VERSION}
          - versionCode: ${GITHUB_RUN_NUMBER}
          EOF
          gh release create "$RELEASE_TAG" "$APK_NAME" --title "Wallnut ${VERSION}" --notes-file release-notes.md

      - name: Job summary
        run: |
          {
            echo "### Wallnut APK"
            echo ""
            echo "- \`${APK_NAME}\` built from \`${GITHUB_SHA}\`"
            echo "- versionName \`${VERSION}\` / versionCode \`${GITHUB_RUN_NUMBER}\`"
          } >> "$GITHUB_STEP_SUMMARY"
